<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conflict method control states</title><link rel="stylesheet" href="./style.css"><main><h1>量化方法 · 状态预览</h1><p>Development preview; not part of the application.</p><div id="states"></div></main><script>
for(const [label,attrs]of [['default',''],['hover','is-hover'],['focus-visible','is-focus'],['active','is-active'],['disabled','disabled'],['loading','aria-busy="true"'],['error','data-state="error"'],['success','data-state="success"']]){const row=document.createElement('div');row.className='conflict-method';row.innerHTML=`<label>${label}</label><select class="conflict-method-select ${attrs.startsWith('is-')?attrs:''}" ${attrs.startsWith('is-')?'':attrs} aria-label="${label}"><option>目标增益损失（试验）</option><option>控制动力抵消（旧）</option></select><span role="status">${label==='loading'?'正在计算…':label==='error'?'读取失败，请点击更新量化重试。':label==='success'?'目标受阻评分 14.5 / 100':''}</span>`;document.getElementById('states').append(row);}
</script></html>
