phy_type: "sionna_phy"

custom_phy:
  noise_floor_dbm: -92.0
  base_pathloss_compensation_db: 92.0
  bler_target: 0.1
  # Use a 3GPP-style MCS range instead of the older 0-15 coarse cap.
  max_mcs_index: 27
  min_valid_sinr_db: -40.0
  max_valid_sinr_db: 80.0

sionna_phy:
  enabled: true
  backend: "sionna_tensorflow"
  device: "cpu"
  batch_size: 32
  phy_mode: "system_level_approx"
  num_iter_decoder: 20
  min_supported_sionna_coderate: 0.34
  min_valid_sinr_db: -40.0
  max_valid_sinr_db: 80.0
  bler_smoothing_alpha: 0.5
  bler_smoothing_beta: 0.5
  num_mod_symbols_per_slot: 4096
  subcarriers_per_prb: 12
  max_ofdm_symbols_per_slot: 14
  enable_overlap_interference: true
  enable_cross_frequency_interference: true
  min_spatial_coupling: 0.05
  same_precoder_coupling_multiplier: 1.25
  adjacent_prb_leakage_factor: 0.20
  inter_cell_adjacent_channel_leakage_factor: 0.08
  inter_cell_frequency_guard_decay_scale: 1.0
  inter_cell_far_frequency_leakage_floor: 0.000001
  same_group_interference_reduction: 0.65
  mu_mimo_bonus_db_max: 1.5
  shadow_compare_enabled: false
  shadow_compare_adapter: "custom_phy"
  shadow_compare_base_pathloss_compensation_db: 92.0
  shadow_compare_noise_floor_dbm: -92.0
  shadow_compare_bler_target: 0.1
  # Keep the shadow comparator aligned with the main NR-style MCS range.
  shadow_compare_max_mcs_index: 27
  small_scale_model: "gaussian"
  small_scale_std_db: 3.5
  noise_power_mode: "thermal"
  bandwidth_hz: 20000000.0
  noise_figure_db: 9.0
  interference_margin_db: 1.5
  sinr_margin_db: 8.0
  num_bits_per_block: 8192
  default_modulation: "qpsk"
  noise_floor_dbm: -92.0
  code_block_size_bits: 128
  awgn_channel:
    enabled: true
  link_adaptation:
    qpsk_sinr_threshold_db: -2.0
    qam16_sinr_threshold_db: 7.0
  gains:
    tx_power_reference_dbm: 28.0
    codebook_gain_step_db: 0.8
    beam_profile_gain_step_db: 0.6
  bler_model:
    mode: "smooth_from_sinr"
    center_sinr_db: 9.0
    slope: 1.2
  cdl_su_mimo:
    waveform_backend: "cdl_su_mimo_proxy"
    delay_penalty_scale_db: 1.8
    k_factor_bonus_scale_db: 0.6
    angle_spread_bonus_scale_db: 0.5
    spatial_correlation_penalty_scale_db: 1.2
    los_bonus_db: 0.15
    dmrs_overhead_fraction_default: 0.0714
    dmrs_overhead_fraction_dense: 0.1428
