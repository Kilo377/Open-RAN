ues:
  - ue_id: "ue_0"
    queue_bytes: 1000
    throughput_mbps: 0.0
    sinr_db: 10.0
    radio_quality_db: 9.0
    bler: 0.1
    serving_beam_id: 0
    slice_id: "embb"
    traffic_type: "video"
    latency_budget_ms: 100.0
    priority: 1

    # Traffic arrival process (bytes arrive into queue each slot)
    arrival_model: "on_off"
    arrival_rate_bps: 6000000
    burst_size_bytes: 2000
    on_duration_slots: 50
    off_duration_slots: 20
    start_offset_slots: 0
    max_queue_bytes: 200000

  - ue_id: "ue_1"
    queue_bytes: 2000
    throughput_mbps: 0.0
    sinr_db: 11.0
