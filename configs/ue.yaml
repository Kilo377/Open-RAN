    traffic_type: "control"
    latency_budget_ms: 10.0
    priority: 3

    arrival_model: "cbr"
    arrival_rate_bps: 1000000
    max_queue_bytes: 80000

  - ue_id: "ue_2"
    queue_bytes: 3000
    throughput_mbps: 0.0
    sinr_db: 12.0
    radio_quality_db: 10.0
    bler: 0.1
    serving_beam_id: 0
