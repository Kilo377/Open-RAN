experiment_name: "cross_scenario_generalization_v1"
intent_text: "Increase cluster throughput by 10% while keeping BLER stable"
manifest_path: "experiments/manifests/generalization_manifest.csv"
base_output_dir: "outputs/generalization"
reference_scenario_id: "benchmark_nominal_cluster"

variants:
  - "full_method"
  - "static_xapp_selection"
  - "no_rl_guidance"
  - "no_safety_shield"

seeds:
  - 1
  - 2
  - 3

matrix_defaults:
  default_matrix_name: "orchestration_benchmark_suite"

preflight:
  require_api_key: true
  llm_api_key_env_var: "DEEPSEEK_API_KEY"
  fail_fast_on_missing_api_key: true

xapp_pool_profiles:
  full_portfolio:
    description: "Full Near-RT xApp portfolio used by the benchmark configuration."
    allowed_xapp_categories:
      - "mobility_predictor_xapp"
      - "traffic_steering_xapp"
      - "power_saving_xapp"
      - "spectrum_optimizer_xapp"
      - "latency_scheduler_xapp"
      - "massive_mimo_beamformer_xapp"
      - "ran_slicing_manager_xapp"
      - "urllc_guard_xapp"
      - "cell_sleep_xapp"
  radio_guard_portfolio:
    description: "A trimmed portfolio that keeps throughput, steering, slicing, and URLLC guard xApps."
    allowed_xapp_categories:
      - "traffic_steering_xapp"
      - "spectrum_optimizer_xapp"
      - "latency_scheduler_xapp"
      - "massive_mimo_beamformer_xapp"
      - "ran_slicing_manager_xapp"
      - "urllc_guard_xapp"
  mobility_safe_portfolio:
    description: "A mobility-aware portfolio that retains mobility, steering, beamforming, spectrum, and URLLC protection."
    allowed_xapp_categories:
      - "mobility_predictor_xapp"
      - "traffic_steering_xapp"
      - "spectrum_optimizer_xapp"
      - "latency_scheduler_xapp"
      - "massive_mimo_beamformer_xapp"
      - "urllc_guard_xapp"

reporting:
  primary_metrics:
    - "intent_loss_normalized"
    - "mean_observable_throughput_mbps"
    - "final_observable_bler"
    - "safety_violation_rate"
    - "xapp_switching_cost_mean"
    - "stability_penalty_mean"
