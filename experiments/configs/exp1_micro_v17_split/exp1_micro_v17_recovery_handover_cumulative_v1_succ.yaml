experiment_name: exp1_micro_v17_recovery_handover_cumulative_v1_succ
manifest_path: experiments/manifests/oran_paper_eval_manifest.csv
base_output_dir: E:/oran_slot_sim_outputs/paper_eval
reference_scenario_id: oran_medium_dense_hotspot_high_mobility
intent_subset:
- handover-edge-video
warmup_scenario_ids:
- oran_medium_dense_hotspot_high_mobility
transfer_scenario_ids:
- oran_medium_high_mobility_interference
variants:
- success_only_memory
seeds:
- 1
matrix_defaults:
  default_matrix_name: oran_paper_eval_suite
preflight:
  require_api_key: true
  llm_api_key_env_var: DEEPSEEK_API_KEY
memory_transfer:
  enabled: true
  cumulative_memory_enabled: true
  cumulative_memory_dir: E:/oran_slot_sim_outputs/paper_eval/exp1_micro_v17_inherited_memory
  shared_memory_scope: seed
  warmup_repeats: 2
  transfer_repeats: 4
  persistent_variants:
  - success_only_memory
  success_memory_size: 256
  reflection_memory_size: 256
  retrieval_top_k: 12
  failure_gap_threshold: 0.08
  convergence_gap_threshold: 0.08
  success_gap_threshold: 0.08
  gap_patience_rounds: 1
  stagnation_patience_rounds: 1
  headline_split: transfer
  rationale: 'Recovery-focused Experiment 1 chunk: inherit cumulative reflective memory,
    expose the same high-mobility transfer scene repeatedly, and measure whether failed-case
    reflection plus Near-RT bounded tuning improves across transfer repeats.'
global_sim_overrides:
  measurement_sinr_window_slots: 8
  measurement_bler_window_tbs: 20
  measurement_throughput_granularity_slots: 10
force_sim_overrides:
  total_slots: 36
  scheduler_max_ues_per_slot: 8
global_ric_overrides:
  xapp_interval_slots: 3
  rapp_interval_slots: 9
  orchestration_warmup_slots: 6
intent_suite:
- intent_slug: handover-edge-video
  intent_id: intent:handover_edge_video
  intent_family: mobility_embb_tradeoff
  macro_weight: 1.35
  intent_text: 'Hard target: for moving edge-video users, keep handover risk below
    0.25 and increase aggregate throughput by 8% without increasing BLER above 0.14.'
  hard_kpi_targets:
  - kpi_name: handover_risk
    objective: minimize
    target_value: 0.25
    tolerance: 0.03
    weight: 2.0
    unit: score
    priority: 5
    hard: true
  - kpi_name: total_throughput_mbps
    objective: maximize
    target_delta_percent: 8
    weight: 2.0
    unit: mbps
    priority: 5
    hard: true
  - kpi_name: avg_bler
    objective: minimize
    target_value: 0.14
    tolerance: 0.02
    weight: 1.2
    unit: ratio
    priority: 4
    hard: true
xapp_pool_profiles:
  full_portfolio:
    allowed_xapp_categories:
    - mobility_predictor_xapp
    - traffic_steering_xapp
    - power_saving_xapp
    - spectrum_optimizer_xapp
    - latency_scheduler_xapp
    - massive_mimo_beamformer_xapp
    - ran_slicing_manager_xapp
    - urllc_guard_xapp
    - cell_sleep_xapp

