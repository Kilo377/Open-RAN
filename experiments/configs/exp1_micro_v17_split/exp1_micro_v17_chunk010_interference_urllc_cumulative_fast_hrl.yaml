experiment_name: exp1_micro_v17_chunk010_interference_urllc_cumulative_fast_hrl
manifest_path: experiments/manifests/oran_paper_eval_manifest.csv
base_output_dir: E:/oran_slot_sim_outputs/paper_eval
reference_scenario_id: oran_medium_interference_edge
intent_subset:
- interference-urllc-coexistence
warmup_scenario_ids:
- oran_medium_interference_edge
transfer_scenario_ids:
- oran_medium_urllc_burst
variants:
- intent_hrl_like
seeds:
- 1
matrix_defaults:
  default_matrix_name: oran_paper_eval_suite
preflight:
  require_api_key: true
  llm_api_key_env_var: DEEPSEEK_API_KEY
memory_transfer:
  enabled: true
  cumulative_memory_enabled: true
  cumulative_memory_dir: E:/oran_slot_sim_outputs/paper_eval/exp1_micro_v17_inherited_memory
  shared_memory_scope: seed
  warmup_repeats: 2
  transfer_repeats: 1
  persistent_variants: []
  success_memory_size: 256
  reflection_memory_size: 256
  retrieval_top_k: 12
  failure_gap_threshold: 0.08
  convergence_gap_threshold: 0.08
  success_gap_threshold: 0.08
  gap_patience_rounds: 1
  stagnation_patience_rounds: 1
  headline_split: transfer
  rationale: 'Cumulative-memory micro chunk: inherit prior reflective memory and test
    interference/URLLC coexistence transfer.'
global_sim_overrides:
  measurement_sinr_window_slots: 8
  measurement_bler_window_tbs: 20
  measurement_throughput_granularity_slots: 10
force_sim_overrides:
  total_slots: 24
  scheduler_max_ues_per_slot: 8
global_ric_overrides:
  xapp_interval_slots: 5
  rapp_interval_slots: 10
  orchestration_warmup_slots: 5
intent_suite:
- intent_slug: interference-urllc-coexistence
  intent_id: intent:interference_urllc_coexistence
  intent_family: interference_latency_conflict
  macro_weight: 1.35
  intent_text: 'Hard target: during inter-cell interference bursts, improve SINR by
    1.5 dB, reduce BLER by 20%, and keep throughput within 95% of the current baseline.'
  hard_kpi_targets:
  - kpi_name: sinr
    objective: maximize
    target_delta_absolute: 1.5
    weight: 2.0
    unit: dB
    priority: 5
    hard: true
  - kpi_name: avg_bler
    objective: minimize
    target_delta_percent: -20
    tolerance: 0.015
    weight: 2.3
    unit: ratio
    priority: 5
    hard: true
  - kpi_name: total_throughput_mbps
    objective: maximize
    target_delta_percent: -5
    weight: 1.0
    unit: mbps
    priority: 3
    hard: true
xapp_pool_profiles:
  full_portfolio:
    allowed_xapp_categories:
    - mobility_predictor_xapp
    - traffic_steering_xapp
    - power_saving_xapp
    - spectrum_optimizer_xapp
    - latency_scheduler_xapp
    - massive_mimo_beamformer_xapp
    - ran_slicing_manager_xapp
    - urllc_guard_xapp
    - cell_sleep_xapp

