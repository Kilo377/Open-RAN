experiment_name: exp1_micro_chunk001_mobility_rerun_v1_succ
manifest_path: experiments/manifests/oran_paper_eval_manifest.csv
base_output_dir: E:/oran_slot_sim_outputs/paper_eval
reference_scenario_id: oran_medium_dense_hotspot_high_mobility
intent_subset:
- mobility-hotspot-stability
warmup_scenario_ids:
- oran_medium_dense_hotspot_high_mobility
transfer_scenario_ids:
- oran_medium_high_mobility_interference
variants:
- success_only_memory
seeds:
- 1
matrix_defaults:
  default_matrix_name: oran_paper_eval_suite
preflight:
  require_api_key: true
  llm_api_key_env_var: DEEPSEEK_API_KEY
memory_transfer:
  enabled: true
  warmup_repeats: 2
  transfer_repeats: 1
  persistent_variants:
  - success_only_memory
  success_memory_size: 64
  reflection_memory_size: 64
  retrieval_top_k: 10
  failure_gap_threshold: 0.08
  convergence_gap_threshold: 0.08
  success_gap_threshold: 0.08
  gap_patience_rounds: 1
  stagnation_patience_rounds: 1
  headline_split: transfer
  rationale: 'Clean rerun of Experiment 1 chunk001: build outcome memory on high-mobility
    hotspot and transfer to high-mobility interference.'
global_sim_overrides:
  measurement_sinr_window_slots: 8
  measurement_bler_window_tbs: 20
  measurement_throughput_granularity_slots: 10
force_sim_overrides:
  total_slots: 24
  scheduler_max_ues_per_slot: 8
global_ric_overrides:
  xapp_interval_slots: 5
  rapp_interval_slots: 10
  orchestration_warmup_slots: 5
intent_suite:
- intent_slug: mobility-hotspot-stability
  intent_id: intent:mobility_hotspot_stability
  intent_family: mobility_robustness
  macro_weight: 1.35
  intent_text: 'Hard target: in dense high-mobility hotspots and shifted high-mobility
    interference, keep handover risk below 0.20, reduce queue backlog by at least
    10%, and maintain at least current aggregate throughput.'
  hard_kpi_targets:
  - kpi_name: handover_risk
    objective: minimize
    target_value: 0.2
    tolerance: 0.03
    weight: 2.8
    unit: risk
    priority: 5
    hard: true
  - kpi_name: total_queue_bytes
    objective: minimize
    target_delta_percent: -10
    weight: 1.5
    unit: bytes
    priority: 4
    hard: true
  - kpi_name: total_throughput_mbps
    objective: maximize
    target_delta_percent: 0
    weight: 1.0
    unit: mbps
    priority: 3
    hard: true
xapp_pool_profiles:
  full_portfolio:
    allowed_xapp_categories:
    - mobility_predictor_xapp
    - traffic_steering_xapp
    - power_saving_xapp
    - spectrum_optimizer_xapp
    - latency_scheduler_xapp
    - massive_mimo_beamformer_xapp
    - ran_slicing_manager_xapp
    - urllc_guard_xapp
    - cell_sleep_xapp
